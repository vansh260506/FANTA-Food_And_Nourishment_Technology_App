name: fanta_app
description: Food & Nutrition Transport App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4

  # Location & Maps
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

  # UI
  cupertino_icons: ^1.0.8

flutter:
  uses-material-design: true

  assets:
    - assets/